<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minecraft Structure Planner</title>
    <link rel="stylesheet" href="./css/style.css">
</head>
<body>
    <div id="app">
        <header class="glass-card">
            <div class="logo">
                <span class="icon">🏗️</span>
                <h1>STRUCTURE MATERIAL <span>PLANNER</span></h1>
            </div>
            <div class="header-actions">
                <button id="btn-projects" class="mc-btn secondary">プロジェクト一覧</button>
                <button id="select-file-btn" class="mc-btn primary">ファイルを選択</button>
            </div>
        </header>

        <!-- プロジェクト管理モーダル -->
        <div id="project-modal" class="modal hidden">
            <div class="modal-content glass-card">
                <h2>プロジェクト一覧</h2>
                <div id="project-list" class="project-list"></div>
                <button id="close-modal" class="mc-btn secondary" style="width:100%; margin-top:1rem;">閉じる</button>
            </div>
        </div>

        <main>
            <!-- 初期状態：ドロップエリア -->
            <section id="drop-zone" class="drop-zone glass-card">
                <div class="drop-content">
                    <div class="drop-icon">🧊</div>
                    <h2>Minecraft ストラクチャーを解析</h2>
                    <p>.mcstructure ファイルをドロップ</p>
                    
                    <div class="import-actions">
                        <button id="manual-select-btn" class="mc-btn primary">ファイルを選択</button>
                        <div class="drop-hint">または</div>
                        <button id="clipboard-import-btn" class="mc-btn secondary">
                            クリップボードから解析
                        </button>
                    </div>
                    <input type="file" id="file-input" accept=".mcstructure" hidden>
                </div>
            </section>

            <!-- サマリー -->
            <section id="summary" class="summary-section hidden">
                <div class="glass-card stats-grid">
                    <div class="stat-item" id="stat-total">
                        <span class="label">総ブロック数</span>
                        <span class="value">0</span>
                    </div>
                    <div class="stat-item" id="stat-unique">
                        <span class="label">種類</span>
                        <span class="value">0</span>
                    </div>
                    <div class="stat-item" id="stat-shulkers">
                        <span class="label">シュルカー箱換算</span>
                        <span class="value">0</span>
                    </div>
                </div>
            </section>

            <!-- 解析結果 -->
            <section id="results" class="results-section hidden">
                <div class="controls-row">
                    <div class="search-box glass-card">
                        <input type="text" id="search-input" placeholder="ブロックを検索...">
                    </div>
                    
                    <div class="display-toggle glass-card">
                        <label class="switch">
                            <input type="checkbox" id="id-toggle">
                            <span class="slider"></span>
                        </label>
                        <span class="toggle-label">ID表示</span>
                    </div>

                    <div class="display-toggle glass-card">
                        <label class="switch">
                            <input type="checkbox" id="wiki-toggle">
                            <span class="slider"></span>
                        </label>
                        <span class="toggle-label">Wikiリンク</span>
                    </div>

                    <div class="category-filters glass-card">
                        <button class="filter-btn active" data-category="all">すべて</button>
                        <button class="filter-btn" data-category="building">建材</button>
                        <button class="filter-btn" data-category="decoration">装飾</button>
                        <button class="filter-btn" data-category="redstone">回路</button>
                        <button class="filter-btn" data-category="nature">自然</button>
                    </div>
                </div>

                <div id="block-list" class="block-list"></div>
            </section>
        </main>

        <div id="toast-container"></div>

        <div id="loading-overlay" class="hidden">
            <div class="loader"></div>
            <p>データを解析しています...</p>
        </div>
    </div>
    <script type="module" src="./js/app.js"></script>
</body>
</html>
